site_name: PNCP Consulta SDK
site_description: SDK Java para a API de Consulta do PNCP (Portal Nacional de Contratações Públicas)
docs_dir: docs
repo_url: https://github.com/GuiHeld/pncp-consulta
edit_uri: ""

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: teal
      accent: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Início: index.md
  - Começando: comecando.md
  - Consultas: consultas.md
  - Paginação: paginacao.md
  - Tratamento de erros: erros.md
  - Limites e resiliência: limites.md
  - Perguntas frequentes: faq.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
