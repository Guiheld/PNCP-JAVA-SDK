name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Testes (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # LTS a partir do piso do projeto (release 17): 17, 21 e 25.
        java: ["17", "21", "25"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar JDK ${{ matrix.java }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Executar testes
        run: mvn -B -ntp test
